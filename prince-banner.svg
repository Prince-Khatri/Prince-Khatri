<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crownGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .letter {
      font-family: 'Courier New', Courier, monospace;
      font-size: 82px;
      font-weight: 700;
      fill: #00D9FF;
      filter: url(#glow);
      opacity: 0;
      animation: flyIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    #P { animation-delay: 0.10s; }
    #R { animation-delay: 0.22s; }
    #I { animation-delay: 0.34s; }
    #N { animation-delay: 0.46s; }
    #C { animation-delay: 0.58s; }
    #E { animation-delay: 0.70s; }

    @keyframes flyIn {
      0%   { opacity: 0; transform: translateY(40px) scale(0.6); }
      60%  { opacity: 1; transform: translateY(-8px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0px) scale(1); }
    }

    /* Crown swings in like it's hung from a pin — pivot is the pin at top-right */
    .crown-group {
      filter: url(#crownGlow);
      opacity: 0;
      transform-origin: 144px 12px;
      animation: crownSwing 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 1.0s;
    }

    @keyframes crownSwing {
      0%   { opacity: 0; transform: rotate(-50deg); }
      40%  { opacity: 1; transform: rotate(10deg);  }
      60%  { opacity: 1; transform: rotate(-7deg);  }
      78%  { opacity: 1; transform: rotate(4deg);   }
      90%  { opacity: 1; transform: rotate(-2deg);  }
      100% { opacity: 1; transform: rotate(-12deg); }
    }

    .underline-bar {
      opacity: 0;
      animation: fadeSlide 0.5s ease forwards;
      animation-delay: 1.7s;
    }

    @keyframes fadeSlide {
      0%   { opacity: 0; transform: scaleX(0); }
      100% { opacity: 1; transform: scaleX(1); }
    }
  </style>

  <!-- Background -->
  <rect width="600" height="200" fill="#0D1117" rx="12"/>

  <!-- Subtle grid dot texture -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#161d2b" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#161d2b" stroke-width="1"/>

  <!-- PRINCE letters -->
  <text id="P" x="96"  y="155" class="letter">P</text>
  <text id="R" x="152" y="155" class="letter">R</text>
  <text id="I" x="214" y="155" class="letter">I</text>
  <text id="N" x="242" y="155" class="letter">N</text>
  <text id="C" x="306" y="155" class="letter">C</text>
  <text id="E" x="370" y="155" class="letter">E</text>

  <!-- Crown group — pin at (144, 12) which is top-right of crown body -->
  <!-- Crown sits roughly over the P letter (x 96-150) -->
  <!-- At rest it hangs at -12deg so it tilts leftward naturally -->
  <g class="crown-group">
    <!-- Hanging pin dot -->
    <circle cx="144" cy="12" r="4.5" fill="#FFD700" stroke="#b8860b" stroke-width="1.5"/>
    <!-- String from pin down to crown top-right corner -->
    <line x1="144" y1="16" x2="144" y2="30" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Crown body -->
    <polygon
      points="72,30  88,58  108,38  128,58  144,30  144,78  72,78"
      fill="#FFD700"
      filter="url(#softShadow)"
    />
    <!-- Bottom band shading -->
    <polygon
      points="72,67  144,67  144,78  72,78"
      fill="#b8860b"
      opacity="0.5"
    />
    <!-- Highlight on left face -->
    <polygon
      points="72,30  88,58  80,58  72,38"
      fill="#FFE55C"
      opacity="0.45"
    />

    <!-- Center spike jewel — ruby red -->
    <circle cx="108" cy="26" r="7.5" fill="#FF2244"/>
    <circle cx="108" cy="26" r="4"   fill="#FF99AA" opacity="0.75"/>

    <!-- Left spike jewel — cyan -->
    <circle cx="72"  cy="26" r="5.5" fill="#00D9FF"/>
    <circle cx="72"  cy="26" r="2.5" fill="#ccf7ff" opacity="0.85"/>

    <!-- Right spike jewel — cyan -->
    <circle cx="144" cy="26" r="5.5" fill="#00D9FF"/>
    <circle cx="144" cy="26" r="2.5" fill="#ccf7ff" opacity="0.85"/>
  </g>

  <!-- Underline accent bar — centered under PRINCE text -->
  <rect
    class="underline-bar"
    x="96" y="165"
    width="328" height="3"
    rx="2"
    fill="#00D9FF"
    opacity="0.65"
    transform-origin="96px 165px"
  />

</svg>

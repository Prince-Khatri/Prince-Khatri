<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prince">
  <defs>
    <radialGradient id="bgGlow" cx="28%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#B8EFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F6F8FA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C2E0"/>
      <stop offset="45%" stop-color="#0090B0"/>
      <stop offset="100%" stop-color="#006B8A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0090B0" stop-opacity="0"/>
      <stop offset="18%" stop-color="#0090B0" stop-opacity="0.75"/>
      <stop offset="82%" stop-color="#0090B0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0090B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EEF4" stop-opacity="0.7"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E8EEF4" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crownGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#C5D0DC" opacity="0.75"/>
    </pattern>
  </defs>

  <style>
    .letter {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 96px;
      font-weight: 700;
      fill: url(#letterGrad);
      filter: url(#glow);
      opacity: 0;
      animation: flyIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    #P { animation-delay: 0.08s; }
    #R { animation-delay: 0.18s; }
    #I { animation-delay: 0.28s; }
    #N { animation-delay: 0.38s; }
    #C { animation-delay: 0.48s; }
    #E { animation-delay: 0.58s; }

    @keyframes flyIn {
      0%   { opacity: 0; transform: translateY(36px) scale(0.72); }
      65%  { opacity: 1; transform: translateY(-6px) scale(1.04); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .crown-swing {
      opacity: 0;
      transform-origin: 268px 22px;
      animation:
        crownEnter 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards,
        crownIdle 3.6s ease-in-out 2.2s infinite;
    }

    @keyframes crownEnter {
      0%   { opacity: 0; transform: rotate(-58deg); }
      42%  { opacity: 1; transform: rotate(12deg); }
      62%  { opacity: 1; transform: rotate(-8deg); }
      78%  { opacity: 1; transform: rotate(4deg); }
      90%  { opacity: 1; transform: rotate(-2deg); }
      100% { opacity: 1; transform: rotate(-12deg); }
    }

    @keyframes crownIdle {
      0%, 100% { transform: rotate(-12deg); }
      50%      { transform: rotate(-8deg); }
    }

    .jewel-pulse {
      animation: jewelPulse 2.4s ease-in-out 2.3s infinite;
    }

    @keyframes jewelPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }

    .underline-bar {
      opacity: 0;
      transform-origin: 450px 188px;
      animation: barGrow 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.65s forwards;
    }

    @keyframes barGrow {
      0%   { opacity: 0; transform: scaleX(0); }
      100% { opacity: 1; transform: scaleX(1); }
    }
  </style>

  <rect width="900" height="220" fill="url(#bgFade)" rx="14"/>
  <rect width="900" height="220" fill="url(#bgGlow)" rx="14"/>
  <rect width="900" height="220" fill="url(#dots)" rx="14" opacity="0.55"/>
  <rect width="900" height="220" fill="url(#vignette)" rx="14"/>

  <ellipse cx="450" cy="170" rx="250" ry="28" fill="#00A8C8" opacity="0.08" filter="url(#softGlow)"/>

  <text id="P" x="241" y="158" class="letter">P</text>
  <text id="R" x="313" y="158" class="letter">R</text>
  <text id="I" x="385" y="158" class="letter">I</text>
  <text id="N" x="457" y="158" class="letter">N</text>
  <text id="C" x="529" y="158" class="letter">C</text>
  <text id="E" x="601" y="158" class="letter">E</text>

  <g class="crown-swing" filter="url(#crownGlow)">
    <circle cx="268" cy="22" r="4.5" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="1.2"/>
    <circle cx="268" cy="22" r="1.6" fill="#FFF3A0" opacity="0.9"/>
    <line x1="268" y1="26.5" x2="268" y2="40" stroke="#E6C200" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <g filter="url(#softShadow)">
      <path
        d="M168 40 L188 72 L214 46 L240 72 L268 40 L268 92 L168 92 Z"
        fill="url(#goldGrad)"
      />
      <rect x="168" y="84" width="100" height="10" fill="#9A7209" opacity="0.55"/>
      <rect x="168" y="84" width="100" height="2.5" fill="#FFE566" opacity="0.35"/>
      <path d="M168 40 L188 72 L180 72 L168 52 Z" fill="#FFF1A8" opacity="0.35"/>
      <path d="M214 46 L240 72 L188 72 Z" fill="#A67C00" opacity="0.18"/>
    </g>

    <g class="jewel-pulse">
      <circle cx="214" cy="36" r="7.5" fill="#E0112B"/>
      <circle cx="214" cy="36" r="7.5" fill="none" stroke="#FF6B81" stroke-width="1" opacity="0.55"/>
      <circle cx="211.5" cy="33.5" r="2.4" fill="#FFB3C1" opacity="0.85"/>
      <circle cx="168" cy="36" r="5.5" fill="#00B8D4"/>
      <circle cx="166.2" cy="34.2" r="1.8" fill="#E8FBFF" opacity="0.9"/>
      <circle cx="268" cy="36" r="5.5" fill="#00B8D4"/>
      <circle cx="266.2" cy="34.2" r="1.8" fill="#E8FBFF" opacity="0.9"/>
    </g>
  </g>

  <rect
    class="underline-bar"
    x="241" y="176"
    width="418" height="3"
    rx="2"
    fill="url(#barGrad)"
  />
</svg>
